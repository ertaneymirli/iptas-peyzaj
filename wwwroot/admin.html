<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>İPTAŞ Peyzaj - Admin Panel</title>
    <link rel="stylesheet" href="/admin.css">
    <link rel="stylesheet" href="/pages/musteriler/musteriler.css">
    <link rel="stylesheet" href="/pages/musteriler/musteri-ekle.css">
    <link rel="stylesheet" href="/pages/bakim-takvimi/bakim-detay-goster.css">
    <link rel="stylesheet" href="/pages/bakim-takvimi/bakim-takvimi.css">
    <link rel="stylesheet" href="/pages/teklif/teklifler.css">
    <link rel="stylesheet" href="/pages/personeller/personeller.css">
    <link rel="stylesheet"
          href="/pages/personeller/personel-ekle.css">
    <link rel="stylesheet" href="/pages/kullanicilar/kullanicilar.css">
    <link rel="stylesheet" href="/pages/kullanicilar/kullanici-ekle.css">
    <link rel="stylesheet" href="/pages/musteri-kullanicisi/musteri-kullanicilari.css">
    <link rel="stylesheet" href="/pages/musteri-kullanicisi/musteri-kullanicilari-ekle.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2>İPTAŞ<br><span>Peyzaj</span></h2>

            <nav>
                <a href="#" onclick="anaSayfaGoster()">Ana Sayfa</a>
                <a href="#" onclick="sayfaYukle('pages/musteriler/musteriler.html')" data-admin>
                    Müşteriler
                </a>
                <a href="#" onclick="sayfaYukle('pages/bakim-takvimi/bakim-takvimi.html')">
                    Bakım Takvimi
                </a>

                <a href="#" onclick="sayfaYukle('pages/teklif/teklifler.html')" data-admin>
                    Teklifler
                </a>

                <a href="#" onclick="sayfaYukle('pages/personeller/personeller.html')" data-admin>
                    Personeller
                </a>
                <a href="#" onclick="sayfaYukle('pages/kullanicilar/kullanicilar.html')" data-admin>
                    Kullanıcılar
                </a>
                <a href="#" onclick="sayfaYukle('pages/musteri-kullanicisi/musteri-kullanicilari.html')" data-admin>
                    Musteri Kullanicilari eşle
                </a>
                <a href="#" onclick="cikis()">Çıkış Yap</a>
            </nav>
        </aside>

        <main class="content">
            <div id="pageContent"></div>

            <template id="anaSayfaTemplate">
                <div class="page-header">
                    <h2>Ana Sayfa</h2>
                    <p id="hosGeldinKullanici"></p>
                </div>

                <section class="cards">
                    <div class="card" onclick="dashboardListeAc('musteri')">
                        <h3>Toplam Müşteri</h3>
                        <strong id="toplamMusteri">0</strong>
                    </div>

                    <div class="card" onclick="dashboardListeAc('aktif')">
                        <h3>Aktif Bakım</h3>
                        <strong id="aktifBakim">0</strong>
                    </div>

                    <div class="card" onclick="dashboardListeAc('bekleyen')">
                        <h3>Bekleyen İş</h3>
                        <strong id="bekleyenIs">0</strong>
                    </div>
                </section>

                <div id="dashboardPopup" class="dashboard-popup hidden">
                    <div class="dashboard-popup-content">
                        <button type="button"
                                class="popup-close"
                                onclick="dashboardPopupKapat()">
                            ×
                        </button>

                        <h3 id="dashboardPopupBaslik"></h3>

                        <div id="dashboardPopupIcerik"></div>
                    </div>
                </div>
            </template>
        </main>
    </div>

    <script src="/admin.js"></script>
    <script src="/pages/musteriler/musteriler.js"></script>
    <script src="/pages/musteriler/musteri-ekle.js"></script>
    <script src="/pages/bakim-takvimi/bakim-takvimi.js"></script>
    <script src="/pages/bakim-takvimi/bakim-detay-goster.js"></script>
    <script src="/pages/teklif/teklifler.js"></script>
    <script src="/pages/personeller/personeller.js"></script>
    <script src="/pages/personeller/personel-ekle.js"></script>
    <script src="/pages/kullanicilar/kullanicilar.js"></script>
    <script src="/pages/kullanicilar/kullanici-ekle.js"></script>
    <script src="/pages/musteri-kullanicisi/musteri-kullanicilari.js"></script>
    <script src="/pages/musteri-kullanicisi/musteri-kullanicilari-ekle.js"></script>
</body>
</html>
